<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Requests | GoldenGetaways</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #00111f;
      --navy-light: #062238;
      --gold: #d8a13f;
      --gold-light: #f0bd5c;
      --white: #f8f5ef;
      --muted: #aeb7c1;
      --border: rgba(216, 161, 63, 0.25);
      --soft-border: rgba(255,255,255,0.08);
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 70% 10%,
          #08263c 0%,
          #00111f 38%,
          #000b15 100%
        );

      color: var(--white);
      font-family: "DM Sans", sans-serif;

      padding: 45px 25px 70px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page {
      width: min(1100px, 100%);
      margin: auto;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--gold-light);
      font-size: 14px;

      margin-bottom: 40px;
    }

    .heading-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 25px;

      margin-bottom: 35px;
    }

    .eyebrow {
      color: var(--gold-light);
      letter-spacing: 3px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 54px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
    }

    .new-request-button {
      min-height: 50px;
      padding: 0 22px;

      display: inline-flex;
      align-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #b77b24,
          #e0aa47
        );

      color: white;
      font-weight: 500;
      white-space: nowrap;
    }

    .summary-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;

      margin-bottom: 25px;
    }

    .summary-card {
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(7,29,47,0.96),
          rgba(1,15,27,0.97)
        );
    }

    .summary-card small {
      display: block;

      color: var(--muted);
      font-size: 12px;

      margin-bottom: 8px;
    }

    .summary-card strong {
      font-family: "Playfair Display", serif;
      font-size: 27px;
      font-weight: 400;

      color: var(--gold-light);
    }

    .requests-container {
      display: grid;
      gap: 18px;
    }

    .request-card {
      border: 1px solid var(--border);
      border-radius: 20px;

      padding: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(7,29,47,0.97),
          rgba(1,15,27,0.98)
        );

      transition: 0.2s;
    }

    .request-card:hover {
      transform: translateY(-2px);
      border-color: rgba(216,161,63,0.45);
    }

    .request-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;

      padding-bottom: 20px;
      margin-bottom: 20px;

      border-bottom: 1px solid var(--soft-border);
    }

    .destination {
      font-family: "Playfair Display", serif;
      font-size: 29px;
      font-weight: 400;

      margin-bottom: 5px;
    }

    .request-date {
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      padding: 8px 14px;

      border-radius: 50px;
      border: 1px solid rgba(216,161,63,0.35);

      color: var(--gold-light);

      font-size: 11px;
      text-transform: capitalize;

      background: rgba(216,161,63,0.05);
    }

    .request-details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;

      margin-bottom: 20px;
    }

    .detail {
      padding: 17px;

      border: 1px solid var(--soft-border);
      border-radius: 12px;

      background: rgba(255,255,255,0.018);
    }

    .detail small {
      display: block;

      color: var(--muted);
      font-size: 11px;

      margin-bottom: 6px;
    }

    .detail strong {
      font-size: 14px;
      font-weight: 500;
    }

    .notes {
      padding: 18px;

      border-radius: 12px;
      border: 1px solid var(--soft-border);

      background: rgba(255,255,255,0.018);
    }

    .notes small {
      display: block;

      color: var(--gold-light);
      font-size: 11px;
      letter-spacing: 1px;

      margin-bottom: 7px;
    }

    .notes p {
      color: #d1d6dc;

      font-size: 13px;
      line-height: 1.6;
    }

    .empty-state {
      padding: 65px 25px;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(7,29,47,0.97),
          rgba(1,15,27,0.98)
        );
    }

    .empty-icon {
      font-size: 38px;
      color: var(--gold-light);

      margin-bottom: 18px;
    }

    .empty-state h2 {
      font-family: "Playfair Display", serif;
      font-weight: 400;
      font-size: 29px;

      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--muted);

      margin-bottom: 22px;
    }

    .loading {
      padding: 60px;

      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 800px) {
      .heading-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-bar {
        grid-template-columns: 1fr;
      }

      .request-details {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 30px 18px 60px;
      }

      h1 {
        font-size: 42px;
      }

      .request-details {
        grid-template-columns: 1fr;
      }

      .request-top {
        flex-direction: column;
      }

      .request-card {
        padding: 22px;
      }
    }
    /* ===== GOLDENGETAWAYS HOLIDAY OPTIONS ===== */

.gg-options-section {
    margin-top: 28px;
    padding-top: 28px;
    border-top: 1px solid rgba(212, 161, 54, 0.22);
}

.gg-options-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
}

.gg-options-label {
    display: block;
    color: #e2aa3b;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

.gg-options-header h3 {
    margin: 0 0 6px;
    font-family: "Playfair Display", serif;
    font-size: 28px;
    font-weight: 400;
    color: #ffffff;
}

.gg-options-header p {
    margin: 0;
    color: #9fb0c0;
    font-size: 14px;
}

.gg-options-count {
    flex-shrink: 0;
    padding: 8px 13px;
    border: 1px solid rgba(226, 170, 59, 0.45);
    border-radius: 999px;
    color: #e2aa3b;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
}

.gg-options-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.gg-option-card {
    padding: 22px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.gg-option-card:hover {
    transform: translateY(-2px);
    border-color: rgba(226, 170, 59, 0.45);
}

.gg-option-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.gg-option-number {
    color: #e2aa3b;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.gg-option-price {
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
}

.gg-option-hotel {
    margin: 0 0 10px;
    color: #ffffff;
    font-family: "Playfair Display", serif;
    font-size: 22px;
    font-weight: 400;
}

.gg-option-notes {
    margin: 0 0 18px;
    color: #aab8c5;
    font-size: 13px;
    line-height: 1.6;
}

.gg-option-button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    box-sizing: border-box;
    margin-top: 18px;
    padding: 12px 15px;
    border-radius: 9px;
    background: linear-gradient(135deg, #c98920, #e7ad3d);
    color: #ffffff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: transform 0.2s ease, filter 0.2s ease;
}

.gg-option-button:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

/* Mobile */
@media (max-width: 700px) {
    .gg-options-grid {
        grid-template-columns: 1fr;
    }

    .gg-options-header {
        flex-direction: column;
    }

    .gg-option-card {
        padding: 18px;
    }

    .gg-options-header h3 {
        font-size: 24px;
    }
}
/* Holiday option image */

.gg-option-image {
    position: relative;
    height: 190px;
    margin: -22px -22px 20px;
    overflow: hidden;
    border-radius: 14px 14px 0 0;
}

.gg-option-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.gg-option-image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(2, 20, 33, 0.05) 45%,
        rgba(2, 20, 33, 0.95) 100%
    );
    pointer-events: none;
}

@media (max-width: 700px) {
    .gg-option-image {
        height: 165px;
        margin: -18px -18px 18px;
    }
}
.gg-option-card h4 {
    font-family: "Playfair Display", serif;
    font-size: 30px;
    font-weight: 500;
    color: #ffffff;
    margin: 22px 0 10px;
    letter-spacing: -0.5px;
}

.gg-option-card > p {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    padding: 7px 13px;
    margin: 0 0 20px;
    
    border: 1px solid rgba(226, 164, 46, 0.45);
    border-radius: 999px;
    
    background: rgba(226, 164, 46, 0.08);
    color: #e2a42e;
    
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
}
.gg-option-card {
    display: flex;
    flex-direction: column;
    gap: 0;
}

.gg-option-card h4 {
    margin-top: 12px;
    margin-bottom: 8px;
}

.gg-option-card > p {
    margin-bottom: 12px;
}

.view-holiday-button {
    margin-top: 8px;
}
  </style>
</head>

<body>

  <main class="page">

    <a href="dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <div class="heading-row">

      <div>
        <p class="eyebrow">
          YOUR GOLDENGETAWAYS TRIPS
        </p>

        <h1>My Requests</h1>

        <p class="intro">
          View every personalised holiday request you've sent to GoldenGetaways.
        </p>
      </div>

      <a href="dashboard.html#requestHoliday" class="new-request-button">
        + New Holiday Request
      </a>

    </div>

    <section class="summary-bar">

      <div class="summary-card">
        <small>Total Requests</small>
        <strong id="totalRequests">0</strong>
      </div>

      <div class="summary-card">
        <small>Pending</small>
        <strong id="pendingRequests">0</strong>
      </div>

      <div class="summary-card">
        <small>Completed</small>
        <strong id="completedRequests">0</strong>
      </div>

    </section>

    <section
      class="requests-container"
      id="requestsContainer"
    >
      <div class="loading">
        Loading your holiday requests...
      </div>
    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>


  <script>

    async function loadRequests() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (!session) {
        window.location.href = "join.html";
        return;
      }
      const { data: accessProfile, error: accessError } =
  await supabaseClient
    .from("profiles")
    .select("membership_status")
    .eq("id", session.user.id)
    .maybeSingle();

if (
  accessError ||
  !accessProfile ||
  accessProfile.membership_status !== "active"
) {
  window.location.href = "membership.html";
  return;
}


      const { data: requests, error } =
        await supabaseClient
          .from("holiday_requests")
        .select(`
  *,
  holiday_request_options (
    id,
    hotel_name,
    price,
    holiday_url,
    notes,
    created_at
  )
`)
          .eq("user_id", session.user.id)
          .order("created_at", {
            ascending: false
          });
         console.log(
  "HOLIDAY OPTIONS:",
  requests?.[0]?.holiday_request_options
);

      const container =
        document.getElementById("requestsContainer");


      if (error) {

        console.error(
          "Request loading error:",
          error
        );

        container.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              !
            </div>

            <h2>
              We couldn't load your requests
            </h2>

            <p>
              Please refresh the page and try again.
            </p>

          </div>
        `;

        return;
      }


      const total =
        requests?.length || 0;


      const pending =
        requests?.filter(
          request =>
            (request.status || "pending")
              .toLowerCase() === "pending"
        ).length || 0;


      const completed =
        requests?.filter(
          request =>
            (request.status || "")
              .toLowerCase() === "completed"
        ).length || 0;


      document
        .getElementById("totalRequests")
        .textContent = total;


      document
        .getElementById("pendingRequests")
        .textContent = pending;


      document
        .getElementById("completedRequests")
        .textContent = completed;


      if (!requests || requests.length === 0) {

        container.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              ✈
            </div>

            <h2>
              No holiday requests yet
            </h2>

            <p>
              When you send a personalised holiday request,
              it'll appear here.
            </p>

            <a
             href="dashboard.html#requestHoliday"
              class="new-request-button"
            >
              Request a Holiday →
            </a>

          </div>
        `;

        return;
      }


      container.innerHTML = "";


      requests.forEach(request => {

        const card =
          document.createElement("article");


        card.className =
          "request-card";


        const createdDate =
          request.created_at
            ? new Date(
                request.created_at
              ).toLocaleDateString(
                "en-GB",
                {
                  day: "numeric",
                  month: "long",
                  year: "numeric"
                }
              )
            : "Date unavailable";


        const childrenText =
          Number(request.children || 0);

        const options = request.holiday_request_options || [];

       const holidayOptionsHTML = options.length
  ? `
    <div class="gg-options-section">

      <div class="gg-options-header">
        <div>
          <span class="gg-options-label">PERSONALISED FOR YOU</span>
          <h3>Your Holiday Options</h3>
          <p>We've handpicked these holidays based on your request.</p>
        </div>

        <div class="gg-options-count">
          ${options.length} ${options.length === 1 ? "OPTION" : "OPTIONS"}
        </div>
      </div>

      <div class="gg-options-grid">
        ${options.map((option, index) => `
          
          <div class="gg-option-card">
          <div class="gg-option-image">
    <img src="images/holiday-option-banner.png" alt="GoldenGetaways">
    <div class="gg-option-image-overlay"></div>
</div>
            <div class="gg-option-top">
              <span class="gg-option-number">
                OPTION ${String(index + 1).padStart(2, "0")}
              </span>

              ${option.price ? `
                <span class="gg-option-price">
                  ${escapeHTML(option.price)}
                </span>
              ` : ""}
            </div>

            <h4 class="gg-option-hotel">
              ${escapeHTML(option.hotel_name || "Holiday option")}
            </h4>

            ${option.notes ? `
              <p class="gg-option-notes">
                ${escapeHTML(option.notes)}
              </p>
            ` : ""}

            <a
              href="${escapeHTML(option.holiday_url)}"
              target="_blank"
              rel="noopener noreferrer"
              class="gg-option-button"
            >
              View Holiday
              <span>→</span>
            </a>

          </div>

        `).join("")}
      </div>

    </div>
  `
  : "";
        card.innerHTML = `

          <div class="request-top">

            <div>

              <h2 class="destination">
                ${escapeHTML(
                  request.destination ||
                  "Destination not specified"
                )}
              </h2>

              <p class="request-date">
                Requested ${createdDate}
              </p>

            </div>

            <span class="status">
              ${escapeHTML(
                request.status ||
                "pending"
              )}
            </span>

          </div>


          <div class="request-details">

            <div class="detail">

              <small>
                Local Airport
              </small>

              <strong>
                ${escapeHTML(
                  request.local_airport ||
                  "Not specified"
                )}
              </strong>

            </div>


            <div class="detail">

              <small>
                Travellers
              </small>

              <strong>
                ${request.adults ?? 1}
                Adult${Number(request.adults ?? 1) === 1 ? "" : "s"}
                ${childrenText > 0
                  ? ` • ${childrenText} Child${childrenText === 1 ? "" : "ren"}`
                  : ""}
              </strong>

            </div>


            <div class="detail">

              <small>
                Duration
              </small>

              <strong>
                ${request.nights
                  ? `${request.nights} Nights`
                  : "Not specified"}
              </strong>

            </div>


            <div class="detail">

              <small>
                Budget
              </small>

              <strong>
                ${request.budget
                  ? `£${Number(
                      request.budget
                    ).toLocaleString("en-GB")}`
                  : "Not specified"}
              </strong>

            </div>

          </div>


          <div class="notes">

            <small>
              ADDITIONAL DETAILS
            </small>

            <p>
              ${escapeHTML(
                request.notes ||
                "No additional details provided."
              )}
            </p>

          </div>
          ${holidayOptionsHTML}
        `;


        container.appendChild(card);

      });

    }


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    loadRequests();

  </script>

</body>
</html>
